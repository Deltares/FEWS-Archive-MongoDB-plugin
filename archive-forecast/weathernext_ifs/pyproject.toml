[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathernext_ifs"
version = "0.6"
description = "FEWS WeatherNext IFS"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "cfgrib",
  "requests",
  "urllib3",
  "scipy",
  "netcdf4",
  "xmltodict",
  "urllib3",
  "pysolar",
  "jax",
  "dm-haiku",
  "archive_forecast"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["weathernext_ifs", "weathernext_ifs.*"]
exclude = []