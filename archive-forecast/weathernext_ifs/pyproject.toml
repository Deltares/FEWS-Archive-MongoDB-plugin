[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "weathernext_ifs"
version = "0.6"
description = "FEWS WeatherNext IFS"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "cfgrib",
  "netcdf4",
  "jax",
  "dm-haiku",
  "archive_forecast"
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 75

[tool.uv.sources]
archive_forecast = { path = "../archive_forecast", editable = true }
