[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "archive_forecast"
version = "0.6"
description = "FEWS Archive Forecast Common"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netcdf4",
  "pysolar",
  "scipy",
  "xmltodict",
  "requests",
  "urllib3"
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 95
