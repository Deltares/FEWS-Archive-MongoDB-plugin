[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive_forecast"
version = "0.6"
description = "FEWS Archive Forecast Common"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netcdf4",
  "pysolar",
  "xmltodict",
  "requests",
  "urllib3"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archive_forecast", "archive_forecast.*"]
exclude = []