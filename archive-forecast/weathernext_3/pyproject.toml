[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathernext_3"
version = "0.6"
description = "FEWS WeatherNext 3"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "netcdf4",
  "requests",
  "urllib3",
  "google-auth",
  "xmltodict",
  "archive_forecast"
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["weathernext_3", "weathernext_3.*"]
exclude = []

[tool.uv.sources]
archive_forecast = { path = "../archive_forecast", editable = true }