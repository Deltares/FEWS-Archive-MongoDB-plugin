[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathernext_3"
version = "0.6"
description = "FEWS WeatherNext 3"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "pandas",
  "xarray",
  "netcdf4",
  "zarr",
  "dask",
  "obstore",
  "xmltodict"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["weathernext_3", "weathernext_3.*"]
exclude = []