[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive_forecast"
version = "0.6"
description = "FEWS Archive Forecast"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "scipy",
  "netcdf4",
  "zarr",
  "xmltodict",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["archive_forecast", "archive_forecast.*"]
exclude = []