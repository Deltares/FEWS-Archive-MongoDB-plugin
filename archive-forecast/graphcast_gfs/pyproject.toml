[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcast_gfs"
version = "0.6"
description = "FEWS Graphcast GFS"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "cfgrib",
  "requests",
  "urllib3",
  "scipy",
  "netcdf4",
  "xmltodict",
  "pysolar",
  "jax",
  "dm-haiku",
  "archive_forecast"
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphcast_gfs", "graphcast_gfs.*"]
exclude = []

[tool.uv.sources]
archive_forecast = { path = "../archive_forecast", editable = true }