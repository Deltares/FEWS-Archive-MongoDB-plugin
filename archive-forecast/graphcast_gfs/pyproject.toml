[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcast_gfs"
version = "0.6"
description = "FEWS Graphcast GFS"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "INFISYS INC" }
]
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "scipy",
  "netcdf4",
  "zarr",
  "xmltodict"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphcast_gfs", "graphcast_gfs.*"]
exclude = []